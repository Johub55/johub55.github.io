<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systeem Fout | Johub55</title>
    <style>
        body {
            background-color: #040811;
            color: #39d353;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        .terminal-box {
            background: rgba(13, 17, 23, 0.95);
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 600px;
            width: 85%;
            box-shadow: 0 0 20px rgba(57, 211, 83, 0.2);
            z-index: 5;
            position: relative;
        }

        /* 404 ALS GROTE GEHEIME KNOP */
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #ff7b72;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 123, 114, 0.5);
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.1s;
        }
        .error-code:hover {
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(255, 123, 114, 0.8);
        }

        h1 { font-size: 1.8rem; color: #f0f6fc; margin: 15px 0; }
        .typewriter-text { color: #8b949e; font-size: 1rem; min-height: 45px; margin-bottom: 30px; line-height: 1.5; }
        
        .btn {
            background-color: transparent; color: #39d353; border: 2px solid #39d353;
            padding: 12px 24px; text-decoration: none; border-radius: 6px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
            display: inline-block; z-index: 6; position: relative;
        }
        .btn:hover { background-color: #39d353; color: #0d1117; box-shadow: 0 0 10px rgba(57, 211, 83, 0.5); }
    </style>
</head>
<body>

    <canvas id="matrixCtx"></canvas>

    <div class="terminal-box" id="box">
        <!-- Klik hierop voor de zelfvernietigings-easter egg! -->
        <div class="error-code" id="error-num" onclick="triggerDestruct()">404</div>
        <h1 id="error-title">PAGE_NOT_FOUND</h1>
        <div class="typewriter-text" id="terminal-output"></div>
        
        <a href="/" class="btn">Reboot (Home)</a>
    </div>

    <script>
        // --- 1. DYNAMISCHE TEXT EN JOUW NIEUWE INPUT ---
        const pad = window.location.pathname.replace(/\//g, "").toLowerCase();
        let code = "404";
        let title = "PAGE_NOT_FOUND";
        
        // JOUW AANGEPASTE TEKST HIERONDER VERWERKT:
        let boodschap = "ERROR: Pagina niet gevonden vraag aan Johub55 of zoek op de home pagina... Zoekopdracht afgebroken.";

        if (pad === "418") {
            code = "418"; title = "I_AM_A_TEAPOT"; boodschap = "CRITICAL: De server weigert koffie te zetten, het is een theepot. 🫖";
        } else if (pad === "413") {
            code = "413"; title = "CONTENT_TOO_LARGE"; boodschap = "ERROR: Je data is veel te zwaar! De server weigert dit te tillen.";
        } else if (pad.startsWith("5")) {
            code = pad.toUpperCase(); title = "SERVER_EXPLOSION"; boodschap = "FATAL: Een 5xx server-error! Ergens huilt nu een developer.";
        } else if (pad === "143") {
            code = "143"; title = "SIGTERM_KILLED"; boodschap = "STOP: Proces succesvol stopgezet via Linux (Code 143).";
        }

        document.getElementById("error-num").innerText = code;
        document.getElementById("error-title").innerText = title;
        
        const output = document.getElementById("terminal-output");
        let index = 0;
        function typeWriter() {
            if (index < boodschap.length) {
                output.innerHTML += boodschap.charAt(index);
                index++;
                setTimeout(typeWriter, 35);
            }
        }
        window.onload = () => { typeWriter(); startMatrix(); };


        // --- 2. DE BRILJANTE INSPECTEER-DETECTOR ---
        let devtoolsOpen = false;
        const threshold = 160;
        setInterval(() => {
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if ((widthThreshold || heightThreshold) && !devtoolsOpen) {
                devtoolsOpen = true;
                document.getElementById("error-num").innerText = "999";
                document.getElementById("error-title").innerText = "MAINFRAME_BREACH";
                output.innerHTML = "WARNING: Onbevoegde inspectie gedetecteerd in Johub55's mainframe. Tegen-hack gestart... IP gelogd. 🤖";
                output.style.color = "#ff7b72";
            }
        }, 500);


        // --- 3. DE OUDE VERTROUWDE ZELFVERNIETIGING ---
        let count = 5;
        let destructInterval;
        let isDestructing = false;

        function triggerDestruct() {
            if (isDestructing) return; // Voorkom dubbel klikken
            isDestructing = true;
            
            destructInterval = setInterval(() => {
                document.getElementById("error-num").innerText = "00" + count;
                document.getElementById("error-title").innerText = "SELF_DESTRUCT_SEQUENCE";
                output.innerHTML = `CRITICAL: System destruction requested starting sequence ${count}`;
                output.style.color = "#ff7b72";
                count--;

                if (count < 0) {
                    clearInterval(destructInterval);
                    document.getElementById("box").style.display = "none";
                    document.body.style.backgroundColor = "#000";
                    document.body.innerHTML = "<h1 style='color:#ff7b72; font-family:monospace; font-size:2rem; text-align:center; width:100%; margin-top:40vh;'>Error 500: Server not reachable.<br><span style='color:#8b949e; font-size:1.2rem;'>redirecting...</span></h1>";
                    
                    setTimeout(() => { window.location.href = "/"; }, 3000);
                }
            }, 1000);
        }


        // --- 4. RETRO MATRIX REGEN EFFECT ---
        function startMatrix() {
            const canvas = document.getElementById('matrixCtx');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const alphabet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const rainDrops = Array(Math.floor(columns)).fill(1);

            const draw = () => {
                ctx.fillStyle = 'rgba(4, 8, 17, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#39d353';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < rainDrops.length; i++) {
                    const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                    if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        rainDrops[i] = 0;
                    }
                    rainDrops[i]++;
                }
            };
            setInterval(draw, 30);
        }
    </script>
</body>
</html>
