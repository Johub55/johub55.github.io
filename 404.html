<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systeem Fout | Johub55</title>
    <style>
        body {
            background-color: #040811;
            color: #39d353;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* MATRIX CANVAS ACHTERGROND */
        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.15; /* Subtiel op de achtergrond */
        }

        .terminal-box {
            background: rgba(13, 17, 23, 0.95);
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 600px;
            width: 85%;
            box-shadow: 0 0 20px rgba(57, 211, 83, 0.2);
            z-index: 5;
            position: relative;
            transition: all 0.2s ease;
        }

        /* ZELFVERNIETIGING CRASH EFFECT */
        .destruct-active {
            animation: red-flash 0.5s infinite;
            border-color: #ff7b72 !important;
            box-shadow: 0 0 30px rgba(255, 123, 114, 0.5) !important;
        }

        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #ff7b72;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 123, 114, 0.5);
        }

        h1 { font-size: 1.8rem; color: #f0f6fc; margin: 15px 0; }
        .typewriter-text { color: #8b949e; font-size: 1rem; min-height: 45px; margin-bottom: 30px; }
        
        .btn-container { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }

        .btn {
            background-color: transparent; color: #39d353; border: 2px solid #39d353;
            padding: 12px 24px; text-decoration: none; border-radius: 6px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background-color: #39d353; color: #0d1117; box-shadow: 0 0 10px rgba(57, 211, 83, 0.5); }

        .btn-danger { color: #ff7b72; border-color: #ff7b72; }
        .btn-danger:hover { background-color: #ff7b72; color: #0d1117; box-shadow: 0 0 10px rgba(255, 123, 114, 0.5); }

        @keyframes red-flash {
            0%, 100% { background-color: #0d1117; }
            50% { background-color: #2c0d0d; }
        }
    </style>
</head>
<body>

    <!-- De Matrix Regen achtergrond -->
    <canvas id="matrixCtx"></canvas>

    <div class="terminal-box" id="box">
        <div class="error-code" id="error-num">404</div>
        <h1 id="error-title">PAGE_NOT_FOUND</h1>
        <div class="typewriter-text" id="terminal-output"></div>
        
        <div class="btn-container">
            <a href="/" class="btn">Reboot (Home)</a>
            <button class="btn btn-danger" id="destruct-btn" onclick="triggerDestruct()">Zelfvernietiging ⚠️</button>
        </div>
    </div>

    <script>
        // --- 1. DE URL ERROR-VANGER ---
        const pad = window.location.pathname.replace(/\//g, "").toLowerCase();
        let code = "404";
        let title = "PAGE_NOT_FOUND";
        let boodschap = "ERROR: Pagina niet gevonden achter de slash van Johub55... Zoekopdracht afgebroken.";

        if (pad === "418") {
            code = "418"; title = "I_AM_A_TEAPOT"; boodschap = "CRITICAL: De server weigert koffie te zetten, het is een theepot. 🫖";
        } else if (pad === "413") {
            code = "413"; title = "CONTENT_TOO_LARGE"; boodschap = "ERROR: Je data is veel te zwaar! De server weigert dit te tillen.";
        } else if (pad.startsWith("5")) {
            code = pad.toUpperCase(); title = "SERVER_EXPLOSION"; boodschap = "FATAL: Een 5xx server-error! Ergens huilt nu een developer.";
        } else if (pad === "143") {
            code = "143"; title = "SIGTERM_KILLED"; boodschap = "STOP: Proces succesvol stopgezet via Linux (Code 143).";
        }

        document.getElementById("error-num").innerText = code;
        document.getElementById("error-title").innerText = title;
        
        const output = document.getElementById("terminal-output");
        let index = 0;
        function typeWriter() {
            if (index < boodschap.length) {
                output.innerHTML += boodschap.charAt(index);
                index++;
                setTimeout(typeWriter, 35);
            }
        }
        window.onload = () => { typeWriter(); startMatrix(); };

        // --- 2. DE ZELFVERNIETIGINGS TROLL ---
        let count = 5;
        let destructInterval;
        function triggerDestruct() {
            const btn = document.getElementById("destruct-btn");
            const box = document.getElementById("box");
            btn.disabled = true; // Je kunt maar één keer klikken!
            box.classList.add("destruct-active");

            destructInterval = setInterval(() => {
                document.getElementById("error-num").innerText = "00" + count;
                document.getElementById("error-title").innerText = "SELF_DESTRUCT_SEQUENCE";
                output.innerHTML = `CRITICAL: Systeem vernietiging in ${count} seconden... Sluit alle tabbladen!`;
                output.style.color = "#ff7b72";
                count--;

                if (count < 0) {
                    clearInterval(destructInterval);
                    box.style.display = "none";
                    document.body.style.backgroundColor = "#000";
                    document.body.innerHTML = "<h1 style='color:#ff7b72; font-family:monospace; font-size:2rem; text-align:center; width:100%; margin-top:40vh;'>Error 500: Server succesvol opgeblazen.<br><span style='color:#8b949e; font-size:1.2rem;'>Grapje. Systeem herstarten...</span></h1>";
                    
                    setTimeout(() => { window.location.href = "/"; }, 3000);
                }
            }, 1000);
        }

        // --- 3. RETRO MATRIX REGEN EFFECT ---
        function startMatrix() {
            const canvas = document.getElementById('matrixCtx');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const katakana = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const alphabet = katakana.split("");

            const fontSize = 16;
            const columns = canvas.width / fontSize;

            const rainDrops = [];
            for (let x = 0; x < columns; x++) {
                rainDrops[x] = 1;
            }

            const draw = () => {
                ctx.fillStyle = 'rgba(4, 8, 17, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#39d353';
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < rainDrops.length; i++) {
                    const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                    if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        rainDrops[i] = 0;
                    }
                    rainDrops[i]++;
                }
            };
            setInterval(draw, 30);
        }
    </script>
</body>
</html>
