<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina niet gevonden</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #58a6ff;
            margin: 0;
            line-height: 1;
        }
        h1 {
            font-size: 2rem;
            color: #f0f6fc;
            margin: 20px 0 10px 0;
        }
        p {
            font-size: 1.1rem;
            color: #8b949e;
            max-width: 500px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            background-color: #238636;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2ea44f;
        }
    </style>
</head>
<body>

    <div class="error-code">404</div>
    <h1>Task failed successfully.</h1>
    <p>Oeps! Er staat niks achter deze slash. Deze pagina bestaat niet op de website van Johub55.</p>
    
    <!-- De / stuurt de bezoeker direct terug naar jouw hoofd-homepage -->
    <a href="/" class="btn">Breng me in veiligheid</a>

</body>
</html>
