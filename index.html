<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johub55 | Home</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --card-bg: #161b22;
            --card-border: #30363d;
            --btn-green: #238636;
            --btn-gray: #21262d;
            --btn-gray-border: #363b42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px 20px;
            max-width: 800px;
        }

        .glitch-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #f0f6fc;
            margin: 0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            user-select: none;
        }
        .glitch-title:hover { color: #39d353; }

        .error-ticker {
            font-family: "Courier New", Courier, monospace;
            color: #ff7b72;
            background-color: #21262d;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 15px;
            font-size: 0.9rem;
            border: 1px solid #363b42;
        }

        .subtitle { color: #8b949e; font-size: 1.2rem; margin-top: 20px; }
        main { width: 90%; max-width: 1000px; padding-bottom: 60px; }
        h2 { border-bottom: 1px solid var(--card-border); padding-bottom: 10px; color: #f0f6fc; font-size: 1.5rem; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .project-card:hover { transform: translateY(-4px); border-color: var(--accent-color); }

        .project-title { font-size: 1.3rem; font-weight: 600; color: #58a6ff; margin: 0 0 10px 0; text-transform: capitalize; }
        .project-desc { color: #8b949e; font-size: 0.95rem; line-height: 1.4; margin: 0 0 24px 0; flex-grow: 1; }
        .btn-container { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            display: inline-block;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .btn-live { background-color: var(--btn-green); color: #ffffff; }
        .btn-live:hover { background-color: #2ea44f; }
        .btn-repo { background-color: var(--btn-gray); color: #c9d1d9; border: 1px solid var(--btn-gray-border); }
        .btn-repo:hover { background-color: #30363d; border-color: #8b949e; }

        .status-msg { text-align: center; color: #8b949e; font-style: italic; padding: 40px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <h1 class="glitch-title" data-value="JOHUB55">JOHUB55</h1>
        <div class="error-ticker" id="ticker">Systeem status: OK. Beweeg je muis over mijn naam...</div>
        <p class="subtitle">Welkom op mijn officiële GitHub startpagina.</p>
    </header>

    <main>
        <h2>Mijn Projecten & Games</h2>
        <div class="projects-grid" id="projects-container">
            <div class="status-msg" id="status">Projecten laden...</div>
        </div>
    </main>

    <script>
        const username = 'Johub55';
        const container = document.getElementById('projects-container');
        const statusMsg = document.getElementById('status');

        // REPOS RECHTSTREEKS EN SNEL LADEN
        fetch(`https://api.github.com/{username}/repos?sort=updated&per_page=100`)
            .then(res => { if (!res.ok) throw new Error(); return res.json(); })
            .then(repos => {
                const projectRepos = repos.filter(repo => repo.name.toLowerCase() !== `${username.toLowerCase()}.github.io`);
                if (projectRepos.length === 0) { statusMsg.innerText = "Geen openbare projecten gevonden."; return; }

                container.innerHTML = '';

                repos.forEach(repo => {
                    // Sla de hoofd-repo over
                    if (repo.name.toLowerCase() === `${username.toLowerCase()}.github.io`) return;

                    const card = document.createElement('div');
                    card.className = 'project-card';
                    const desc = repo.description ? repo.description : 'Bekijk de broncode of open de live app direct via de knoppen hieronder.';

                    // Knoppen bouwen. We gebruiken de 'has_pages' eigenschap van GitHub zelf!
                    let buttonsHtml = `<a href="${repo.html_url}" class="btn btn-repo" target="_blank">Code (GitHub)</a>`;
                    if (repo.has_pages) {
                        buttonsHtml += `<a href="https://${username}.github.io/${repo.name}/" class="btn btn-live" target="_blank">Live Site 🚀</a>`;
                    }

                    card.innerHTML = `
                        <div>
                            <div class="project-title">${repo.name.replace(/-/g, ' ')}</div>
                            <p class="project-desc">${desc}</p>
                        </div>
                        <div class="btn-container">${buttonsHtml}</div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(() => { statusMsg.innerText = "Kon projecten niet laden."; });

        // GRAPPIGE ERROR CODES TICKER
        const funnyErrors = [
            "HTTP 413: Content Too Large (Je code is te dik, hij moet op dieet)",
            "HTTP 418: I'm a Teapot (Server weigert koffie te zetten, het is een theepot) 🫖",
            "HTTP 420: Enhance Your Calm (Rustig aan maat, te veel verzoeken) 🧘",
            "HTTP 451: Unavailable For Legal Reasons (De FBI keurt deze code af) 👮",
            "HTTP 500: Internal Server Error (Ergens huilt nu een developer)",
            "HTTP 508: Loop Detected (De code zit vast in een oneindige existentiële crisis) 🔄",
            "HTTP 530: Site Frozen (De website is bevroren, rekening niet betaald?) ❄️"
        ];

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const title = document.querySelector(".glitch-title");
        const ticker = document.getElementById("ticker");
        let interval = null;

        title.onmouseover = event => {  
            let iteration = 0;
            clearInterval(interval);
            ticker.innerText = funnyErrors[Math.floor(Math.random() * funnyErrors.length)];

            interval = setInterval(() => {
                event.target.innerText = event.target.innerText.split("").map((letter, index) => {
                    if(index < iteration) return event.target.dataset.value[index];
                    return letters[Math.floor(Math.random() * letters.length)];
                }).join("");
                if(iteration >= event.target.dataset.value.length) clearInterval(interval);
                iteration += 1 / 3;
            }, 30);
        };
    </script>
</body>
</html>
