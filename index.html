<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johub55 | Mood Meter</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --card-bg: #161b22;
            --card-border: #30363d;
            --mood-color: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .mood-container {
            background-color: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 85%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        h1 {
            color: #f0f6fc;
            margin-top: 0;
            font-size: 2rem;
        }

        /* GIGANTISCHE MOOD EMOJI */
        .mood-emoji {
            font-size: 6rem;
            margin: 20px 0;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .mood-emoji:active {
            transform: scale(1.2) rotate(5deg);
        }

        /* MOOD STATUS TEKST */
        .mood-status {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--mood-color);
            margin-bottom: 10px;
            transition: color 0.3s;
        }

        .mood-desc {
            color: #8b949e;
            font-size: 1rem;
            min-height: 48px;
            margin-bottom: 30px;
        }

        /* DE INTERACTIEVE SCHUIFBALK */
        .slider-container {
            position: relative;
            margin-bottom: 40px;
        }

        .mood-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #30363d;
            outline: none;
            transition: background 0.3s;
        }

        /* Styling voor het schuifknopje */
        .mood-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--mood-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--mood-color);
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
        }
        .mood-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .btn-home {
            display: inline-block;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #363b42;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn-home:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="mood-container" id="container">
        <h1>Johub55's Mood Meter</h1>
        
        <div class="mood-emoji" id="emoji">🤖</div>
        <div class="mood-status" id="status">Systeem Online</div>
        <div class="mood-desc" id="desc">De server draait stabiel. Geen gekke dingen te melden.</div>

        <div class="slider-container">
            <input type="range" min="1" max="5" value="3" class="mood-slider" id="moodSlider">
        </div>

        <a href="https://github.io" class="btn-home">← Terug naar Dashboard</a>
    </div>

    <script>
        const slider = document.getElementById("moodSlider");
        const emojiEl = document.getElementById("emoji");
        const statusEl = document.getElementById("status");
        const descEl = document.getElementById("desc");
        const container = document.getElementById("container");

        // DE MOOD DATABASE
        const moods = {
            1: {
                emoji: "💀",
                status: "CRITICAL_SYSTEM_FAILURE",
                desc: "Mijn code werkt niet, ik snap niet waarom, en ik wil mijn laptop door het raam gooien.",
                color: "#ff7b72", // Rood
                shadow: "rgba(255, 123, 114, 0.2)"
            },
            2: {
                emoji: "😭",
                status: "StackOverflow Mode",
                desc: "Ik ben al 3 uur een bug aan het zoeken die achteraf een missende puntkomma bleek te zijn.",
                color: "#ffa657", // Oranje
                shadow: "rgba(255, 166, 87, 0.2)"
            },
            3: {
                emoji: "🤖",
                status: "Systeem Standby",
                desc: "Gewoon lekker rustig aan het programmeren. De server draait stabiel zonder foutmeldingen.",
                color: "#58a6ff", // Blauw
                shadow: "rgba(88, 166, 255, 0.2)"
            },
            4: {
                emoji: "😎",
                status: "Task Failed Successfully",
                desc: "Mijn code heeft mega veel waarschuwingen, maar het werkt op de een of andere manier wel. We raken niks meer aan!",
                color: "#39d353", // GitHub Groen
                shadow: "rgba(57, 211, 83, 0.2)"
            },
            5: {
                emoji: "🧙‍♂️",
                status: "God Mode (Linus Torvalds)",
                desc: "Ik heb zojuist een geniale feature gebouwd in één keer zonder foutmeldingen. Ik ben een code-tovenaar.",
                color: "#d4bbff", // Paars
                shadow: "rgba(212, 187, 255, 0.2)"
            }
        };

        function updateMood(value) {
            const currentMood = moods[value];
            
            // Update teksten en emoji
            emojiEl.innerText = currentMood.emoji;
            statusEl.innerText = currentMood.status;
            descEl.innerText = currentMood.desc;
            
            // Update CSS variabelen voor de kleuren en glow-effecten
            document.documentElement.style.setProperty('--mood-color', currentMood.color);
            container.style.borderColor = currentMood.color;
            container.style.boxShadow = `0 8px 32px ${currentMood.shadow}`;
        }

        // Luister naar het schuiven van de slider
        slider.addEventListener("input", (e) => {
            updateMood(e.target.value);
        });

        // Start op de middelste mood (3)
        updateMood(3);
    </script>

</body>
</html>
