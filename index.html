<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systeem Fout</title>
    <style>
        body {
            background-color: #040811;
            color: #39d353;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 2;
            background-size: 100% 2px;
            pointer-events: none;
        }
        .terminal-box {
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 600px;
            width: 85%;
            box-shadow: 0 0 20px rgba(57, 211, 83, 0.2);
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #ff7b72;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 123, 114, 0.5);
        }
        h1 { font-size: 1.8rem; color: #f0f6fc; margin: 15px 0; }
        .typewriter-text { color: #8b949e; font-size: 1rem; min-height: 45px; margin-bottom: 30px; }
        .btn {
            background-color: transparent; color: #39d353; border: 2px solid #39d353;
            padding: 12px 24px; text-decoration: none; border-radius: 6px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; display: inline-block;
        }
        .btn:hover { background-color: #39d353; color: #0d1117; }
    </style>
</head>
<body>

    <div class="terminal-box">
        <!-- Deze code en teksten veranderen nu live via JavaScript! -->
        <div class="error-code" id="error-num">404</div>
        <h1 id="error-title">PAGE_NOT_FOUND</h1>
        <div class="typewriter-text" id="terminal-output"></div>
        <a href="/" class="btn">Reboot Systeem</a>
    </div>

    <script>
        // We kijken naar wat er achter de slash staat
        const pad = window.location.pathname.replace(/\//g, "").toLowerCase();
        
        // Standaard waarden (als het gewoon een typefout is)
        let code = "404";
        let title = "PAGE_NOT_FOUND";
        let boodschap = "ERROR: Pagina niet gevonden. Zoekopdracht afgebroken.";

        // GEANVANCEERDE NESTING: we kapen de 404 als ze een specifieke code intypen!
        if (pad === "418") {
            code = "418";
            title = "I_AM_A_TEAPOT";
            boodschap = "CRITICAL: De server weigert koffie te zetten omdat het een theepot is. 🫖";
        } else if (pad === "413") {
            code = "413";
            title = "CONTENT_TOO_LARGE";
            boodschap = "ERROR: Je data is veel te dik! De server weigert dit te tillen.";
        } else if (pad.startsWith("5")) {
            code = pad.toUpperCase();
            title = "SERVER_EXPLOSION";
            boodschap = "FATAL: Een 5xx server-error! Ergens in de serverruimte is een developer huilend weggelopen.";
        } else if (pad === "143") {
            code = "143";
            title = "SIGTERM_KILLED";
            boodschap = "STOP: Proces succesvol stopgezet via het Linux-systeem (Code 143).";
        }

        // Zet de teksten in het scherm
        document.getElementById("error-num").innerText = code;
        document.getElementById("error-title").innerText = title;
        
        // Typ-animatie voor de boodschap
        const output = document.getElementById("terminal-output");
        let index = 0;
        function typeWriter() {
            if (index < boodschap.length) {
                output.innerHTML += boodschap.charAt(index);
                index++;
                setTimeout(typeWriter, 40);
            }
        }
        window.onload = typeWriter;
    </script>

</body>
</html>
