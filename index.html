<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johub55 | Home</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --card-bg: #161b22;
            --card-border: #30363d;
            --btn-green: #238636;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px 20px;
            max-width: 800px;
        }

        /* GIGANTISCHE EASTER EGG TEKST */
        .glitch-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: #f0f6fc;
            margin: 0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
            user-select: none;
        }
        .glitch-title:hover {
            color: #39d353; /* GitHub groen bij hover */
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.2rem;
            margin-top: 15px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            padding-bottom: 60px;
        }

        h2 {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            color: #f0f6fc;
            font-size: 1.5rem;
        }

        /* GRID STRUKTUUR VOOR REPOS */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* MOOIE DESIGN KAARTEN */
        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #58a6ff;
            margin: 0 0 10px 0;
            text-transform: capitalize;
        }

        .project-desc {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.4;
            margin: 0 0 20px 0;
            flex-grow: 1;
        }

        .project-link {
            display: inline-block;
            background-color: var(--btn-green);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .project-link:hover {
            background-color: #2ea44f;
        }

        /* LOADING & ERROR STATUUS */
        .status-msg {
            text-align: center;
            color: #8b949e;
            font-style: italic;
            padding: 40px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <!-- Beweeg je muis over deze tekst voor de Easter Egg! -->
        <h1 class="glitch-title" data-value="JOHUB55">JOHUB55</h1>
        <p class="subtitle">Welkom op mijn officiële GitHub startpagina. Bekijk mijn projecten hieronder.</p>
    </header>

    <main>
        <h2>Mijn Projecten & Games</h2>
        <div class="projects-grid" id="projects-container">
            <div class="status-msg" id="status">Projecten laden...</div>
        </div>
    </main>

    <script>
        // --- 1. DYNAMISCH JOUW PAGES REPOS OPHALEN ---
        const username = 'Johub55';
        const container = document.getElementById('projects-container');
        const statusMsg = document.getElementById('status');

        fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`)
            .then(response => {
                if (!response.ok) throw new Error('API fout');
                return response.json();
            })
            .then(repos => {
                // Filter de hoofdwebsite zelf uit de lijst, we willen alleen de subprojecten
                const projectRepos = repos.filter(repo => repo.name.toLowerCase() !== `${username.toLowerCase()}.github.io`);

                if (projectRepos.length === 0) {
                    statusMsg.innerText = "Geen openbare projecten gevonden.";
                    return;
                }

                // Verwijder de "loading" boodschap
                container.innerHTML = '';

                // Bouw voor elke repository een mooie kaart
                projectRepos.forEach(repo => {
                    const card = document.createElement('div');
                    card.className = 'project-card';

                    // Fallback beschrijving als je die op github niet hebt ingevuld
                    const description = repo.description ? repo.description : 'Klik hieronder om dit live project te openen en te bekijken.';
                    
                    // De automatische link naar de GitHub Pages versie van dit project
                    const pagesUrl = `https://${username}.github.io/${repo.name}/`;

                    card.innerHTML = `
                        <div>
                            <div class="project-title">${repo.name.replace(/-/g, ' ')}</div>
                            <p class="project-desc">${description}</p>
                        </div>
                        <a href="${pagesUrl}" class="project-link" target="_blank">Open Project →</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                statusMsg.innerText = "Kon projecten niet laden. Bekijk mijn GitHub profiel handmatig.";
                console.error(err);
            });


        // --- 2. EASTER EGG MATRIX CODE EFFECT ---
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const title = document.querySelector(".glitch-title");
        let interval = null;

        title.onmouseover = event => {  
            let iteration = 0;
            clearInterval(interval);
            
            interval = setInterval(() => {
                event.target.innerText = event.target.innerText
                    .split("")
                    .map((letter, index) => {
                        if(index < iteration) {
                            return event.target.dataset.value[index];
                        }
                        return letters[Math.floor(Math.random() * letters.length)];
                    })
                    .join("");
                
                if(iteration >= event.target.dataset.value.length){ 
                    clearInterval(interval);
                }
                
                iteration += 1 / 3;
            }, 30);
        };
    </script>
</body>
</html>
